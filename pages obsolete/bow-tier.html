<!DOCTYPE html>
<html lang="eng">
  <head>
    <link rel="stylesheet" href="css/style.css" />
    <meta charset="utf-8" />
    <title>Narrow One Bow Tier</title>
    <meta name="description" content="Bow Tier List!" />
    <meta name="author" content="Toshysna" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script defer src="js/tierlist.js"></script>
    <script defer src="js/maps.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  </head>
  <body class="page-bows">
    <header></header>

    <img class="logo" src="assets/logo/narrow-one-tier-logo-H-S.png" />
    <div id="tier-list-container">
      <div id="left-buttons">
        <!-------------------------------->
        <div class="button-group">
          <div class="text-left-button">MAP</div>
          <a href="index.html" class="nav-button">
            <img src="assets/icons/map.png" alt="maps" title="Maps Tier List" />
          </a>
        </div>
        <!-------------------------------->
        <div class="button-group">
          <div class="text-left-button">MELEE</div>
          <a href="melee-tier.html" class="nav-button">
            <img
              src="assets/icons/melee.png"
              alt="melee"
              title="Melee Tier List"
            />
          </a>
        </div>
        <!-------------------------------->
        <div class="button-group">
          <div class="text-left-button">ARROW</div>
          <a href="arrow-tier.html" class="nav-button">
            <img
              src="assets/icons/arrow.png"
              alt="arrows"
              title="Arrows Tier List"
            />
          </a>
        </div>
        <!-------------------------------->
        <div class="button-group">
          <div class="text-left-button">SKIN</div>
          <a href="skin-tier.html" class="nav-button">
            <img
              src="assets/icons/skin.png"
              alt="Skin"
              title="Skins Tier list"
            />
          </a>
        </div>
        <!-------------------------------->
      </div>

      <div id="tier-list"></div>

      <button id="capture-btn">
        <img src="assets/icons/download.png" alt="download" />
        <div class="text-right-button">DOWNLOAD</div>
      </button>
    </div>

    <div id="maps"></div>
  </body>
</html>
