<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Community Tierlists</title>
   <link rel="stylesheet" href="/css/community.css">
   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>
<div id="community-header">
    <button id="back-maker" class="header-btn">← Tierlist Maker</button>
    <button id="my-profile" class="header-btn">→ My Profile</button>
</div>


    <h1 class="title">Community Tierlists</h1>
<div id="filters">
    <!-- Dropdown custom catégorie -->
    <div class="filter-dropdown" data-filter="category">
        <div class="filter-selected">All</div>
        <div class="filter-options hidden">
            <div class="filter-option" data-value="all">All</div>
            <div class="filter-option" data-value="map">Map</div>
            <div class="filter-option" data-value="bow">Bow</div>
            <div class="filter-option" data-value="arrow">Arrow</div>
            <div class="filter-option" data-value="skin">Skin</div>
            <div class="filter-option" data-value="melee">Melee</div>
        </div>
    </div>

    <!-- Dropdown custom tri -->
    <div class="filter-dropdown" data-filter="sort">
        <div class="filter-selected">Popular</div>
        <div class="filter-options hidden">
            <div class="filter-option" data-value="popular">Popular</div>
            <div class="filter-option" data-value="recent">Recent</div>
        </div>
    </div>

    <!-- Selects natifs cachés, utilisés par ton JS existant -->
    <select id="filter-category" style="display:none;">
        <option value="all">All</option>
        <option value="map">Map</option>
        <option value="bow">Bow</option>
        <option value="arrow">Arrow</option>
        <option value="skin">Skin</option>
        <option value="melee">Melee</option>
    </select>

    <select id="filter-sort" style="display:none;">
        <option value="recent">Recent</option>
        <option value="popular">Popular</option>
    </select>
</div>


    <div id="community-container" class="community-container">
        <div class="loading">Loading tierlists...</div>
    </div>

    <script defer src="/js/community.js"></script>
</body>
</html>
